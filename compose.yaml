services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ai_operator
      POSTGRES_USER: ai_operator
      POSTGRES_PASSWORD: dev-only-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_operator -d ai_operator"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"

  app:
    build:
      context: .
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://ai_operator:dev-only-password@postgres:5432/ai_operator
      REDIS_URL: redis://redis:6379/0
    command:
      [
        "uvicorn",
        "app.runtime:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  postgres-data:
